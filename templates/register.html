<!DOCTYPE html>
<html>
<head>
    <title>Create Account - Service Request Management System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="login-page">

    <div class="login-container">

        <div class="login-header">
            <h1>Service Request</h1>
            <h1>Management System</h1>
            <p>Create your account and request services easily</p>
        </div>

        <div class="login-card">

            <h2>Create Account</h2>
            <p class="login-subtitle">Register a new account</p>

            <form method="POST" action="/register">

                <label>Name</label>
                <input
                    type="text"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >

                <label>Email</label>
                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

                <label>Password</label>
                <input
                    type="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >

                <label>Account Type</label>
                <select name="role" required>
                    <option value="customer">Customer</option>
                    <option value="service_coordinator">Service Coordinator</option>
                </select>

                <button type="submit" class="login-button">
                    Create Account
                </button>

            </form>

            <p class="register-text">
                Already have an account?
                <a href="/">Login</a>
            </p>

        </div>

    </div>

</body>
</html>
